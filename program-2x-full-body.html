<!DOCTYPE html>
<html lang="en" class="scroll-smooth" data-theme="light">
<head>

  <title>2x/Week Full Body Program - builtbybasics</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cobalt: { DEFAULT: '#2563eb', light: '#3b82f6', dark: '#1d4ed8', glow: '#60a5fa' },
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
            body: ['"Inter"', 'system-ui', 'sans-serif'],

        },
      },

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="css/logo.css" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/reveal.css" />

<body class="programs-page font-body antialiased">

  <header id="site-header" class="site-header">

      <a href="index.html" class="logo" aria-label="builtbybasics home">
        <span class="logo-main">basics</span>
        <span class="logo-sub"><span>built</span><span>by</span></span>
      </a>
      <div class="site-header__links">
        <a href="basics.html" class="site-nav__link">Basics of Training</a>

        <a href="coaching.html" class="site-nav__cta">Coaching</a>

    </nav>
  </header>

  <main class="programs-main">
    <section class="programs-hero">
      <div class="programs-hero__container">
        <div data-reveal-stagger>
          <p class="reveal-item programs-hero__eyebrow">Plans &amp; Programs</p>
          <h1 class="reveal-item programs-hero__title">2x/Week Full Body Program</h1>

          </p>
          <a href="programs.html" class="reveal-item programs-hero__back">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16l-4-4m0 0l4-4m-4 4h18"/></svg>

          </a>

        <div id="program-viewer" class="program-viewer" data-collection="full-body-2x" data-reveal-stagger></div>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p class="site-footer__text">builtbybasics</p>
      <nav class="site-footer__nav" aria-label="Footer navigation">

      </nav>
      <a

        class="site-footer__instagram instagram-link"
        target="_blank"
        rel="noopener noreferrer"
      >@keelanmurphy.pt</a>
    </div>
  </footer>

  <script>
    const header = document.getElementById('site-header');
    window.addEventListener('scroll', () => {
      header.classList.toggle('nav-scrolled', window.scrollY > 40);
    }, { passive: true });
  </script>
  <script src="js/programs-data.js"></script>
  <script src="js/programs.js"></script>
  <script src="js/scroll-reveal.js"></script>
