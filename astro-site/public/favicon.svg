<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="builtbybasics">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#2563eb" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plateFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="barFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#09090b"/>
  <rect width="32" height="32" rx="6" fill="url(#glow)"/>

  <!-- Blueprint tick marks -->
  <g stroke="#3b82f6" stroke-opacity="0.35" stroke-width="0.7" stroke-linecap="round">
    <path d="M4 4.5h2.5M4.5 4v2.5"/>
    <path d="M28 4.5h-2.5M27.5 4v2.5"/>
    <path d="M4 27.5h2.5M4.5 28v-2.5"/>
    <path d="M28 27.5h-2.5M27.5 28v-2.5"/>
  </g>

  <!-- Side-view plate dumbbell (like sketch) -->
  <g transform="rotate(-22 16 16)">
    <!-- Soft fills -->
    <g fill="url(#plateFill)">
      <!-- Left tip + plates -->
      <rect x="2.4" y="13.6" width="1.5" height="4.8" rx="0.55"/>
      <rect x="4.0" y="11.4" width="2.3" height="9.2" rx="0.9"/>
      <rect x="6.4" y="9.6" width="3.2" height="12.8" rx="1.1"/>
      <!-- Right tip + plates -->
      <rect x="22.4" y="9.6" width="3.2" height="12.8" rx="1.1"/>
      <rect x="25.7" y="11.4" width="2.3" height="9.2" rx="0.9"/>
      <rect x="28.1" y="13.6" width="1.5" height="4.8" rx="0.55"/>
    </g>
    <rect x="9.8" y="14.35" width="12.4" height="3.3" rx="1.0" fill="url(#barFill)"/>

    <!-- Line drawing -->
    <g
      fill="none"
      stroke="#60a5fa"
      stroke-width="1.15"
      stroke-linejoin="round"
      stroke-linecap="round"
    >
      <!-- Left stack: tip → outer → inner -->
      <rect x="2.4" y="13.6" width="1.5" height="4.8" rx="0.55"/>
      <rect x="4.0" y="11.4" width="2.3" height="9.2" rx="0.9"/>
      <rect x="6.4" y="9.6" width="3.2" height="12.8" rx="1.1"/>

      <!-- Handle -->
      <rect x="9.8" y="14.35" width="12.4" height="3.3" rx="1.0"/>
      <!-- Light knurl (kept sparse for favicon) -->
      <path d="M12.4 15v2M14.6 15v2M16.8 15v2M19 15v2"/>

      <!-- Right stack: inner → outer → tip -->
      <rect x="22.4" y="9.6" width="3.2" height="12.8" rx="1.1"/>
      <rect x="25.7" y="11.4" width="2.3" height="9.2" rx="0.9"/>
      <rect x="28.1" y="13.6" width="1.5" height="4.8" rx="0.55"/>
    </g>
  </g>
</svg>
