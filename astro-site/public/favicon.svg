<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="builtbybasics">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#2563eb" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.28"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#09090b"/>
  <rect width="32" height="32" rx="6" fill="url(#glow)"/>

  <!-- Blueprint tick marks -->
  <g stroke="#3b82f6" stroke-opacity="0.35" stroke-width="0.7" stroke-linecap="round">
    <path d="M4 4.5h2.5M4.5 4v2.5"/>
    <path d="M28 4.5h-2.5M27.5 4v2.5"/>
    <path d="M4 27.5h2.5M4.5 28v-2.5"/>
    <path d="M28 27.5h-2.5M27.5 28v-2.5"/>
  </g>

  <!-- Soft face fills for volume -->
  <path d="M16 6 L7 10.8 L16 15.6 L25 10.8 Z" fill="url(#topFace)"/>
  <path d="M7 10.8 L16 15.6 L16 25.2 L7 20.4 Z" fill="url(#leftFace)"/>
  <path d="M25 10.8 L16 15.6 L16 25.2 L25 20.4 Z" fill="url(#rightFace)"/>

  <!-- Wireframe etching -->
  <g
    fill="none"
    stroke="#60a5fa"
    stroke-width="1.85"
    stroke-linejoin="round"
    stroke-linecap="round"
  >
    <path d="M16 6 L7 10.8 L16 15.6 L25 10.8 Z"/>
    <path d="M7 10.8 V20.4"/>
    <path d="M16 15.6 V25.2"/>
    <path d="M25 10.8 V20.4"/>
    <path d="M7 20.4 L16 25.2 L25 20.4"/>
  </g>

  <!-- Brighter outer silhouette pass for punch -->
  <g
    fill="none"
    stroke="#93c5fd"
    stroke-opacity="0.45"
    stroke-width="0.7"
    stroke-linejoin="round"
    stroke-linecap="round"
  >
    <path d="M16 6 L7 10.8 L7 20.4 L16 25.2 L25 20.4 L25 10.8 Z"/>
  </g>
</svg>
